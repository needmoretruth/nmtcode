[package]
name = "nmtcode-cli"
description = "Command-line tool for NMT Code: make a symbol as PNG or SVG, and read one back."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "nmtcode"
path = "src/main.rs"
# The library crate `nmtcode` has the same name; its documentation takes the name.
doc = false

[dependencies]
nmtcode = { workspace = true }
nmtcode-core = { workspace = true }
nmtcode-render = { workspace = true }
nmtcode-detect = { workspace = true }

[dev-dependencies]
nmtcode-symbol = { workspace = true }
png = { workspace = true }

[lints]
workspace = true
